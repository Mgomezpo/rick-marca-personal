services:
  rick-api:
    build: .
    container_name: rick-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - TZ=America/Bogota
      - PYTHONUNBUFFERED=1
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

  rick-telegram:
    build: .
    container_name: rick-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=America/Bogota
      - PYTHONUNBUFFERED=1
    command: ["python", "-m", "src.services.telegram_bot"]
    depends_on:
      - rick-api

